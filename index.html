
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Aventura del Jugador</title>

    <link rel="stylesheet" href="estilos.css">
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Aventura del Jugador</h1>

    <div id="perfil">
        <h2>Crear jugador</h2>

        <label>Nombre:</label>
        <input type="text" id="nombre">

        <br><br>

        <label>Fecha de nacimiento:</label>
        <input type="date" id="fecha">

        <br><br>

        <button id="entrar">Entrar al juego</button>

        <p id="mensaje"></p>
    </div>

    <div id="juego" style="display: none;">

        <h2 id="bienvenida"></h2>
        <p id="edad"></p>

        <h3>Misiones</h3>

        <div id="misiones"></div>

        <p id="puntos">Puntos: 0</p>
        <button id="ayuda">Ver ayuda</button>
    </div>
</body>
</html>
